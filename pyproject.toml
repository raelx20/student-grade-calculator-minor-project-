[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-performance-predictor"
version = "1.0.0"
description = "ML pipeline to predict student academic performance"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "gunicorn>=21.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
