<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Academic Performance Predictor</h1>
        <p>Enter student details to predict their final grade</p>
        <form action="/predict" method="POST" class="predict-form">
            <div class="form-group">
                <label for="assignment_1">Assignment 1 Score (0-100)</label>
                <input type="number" id="assignment_1" name="assignment_1" min="0" max="100" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="assignment_2">Assignment 2 Score (0-100)</label>
                <input type="number" id="assignment_2" name="assignment_2" min="0" max="100" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="assignment_3">Assignment 3 Score (0-100)</label>
                <input type="number" id="assignment_3" name="assignment_3" min="0" max="100" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="attendance">Attendance % (0-100)</label>
                <input type="number" id="attendance" name="attendance" min="0" max="100" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="study_hours">Weekly Study Hours (0-50)</label>
                <input type="number" id="study_hours" name="study_hours" min="0" max="50" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="past_gpa">Past CGPA (0-10)</label>
                <input type="number" id="past_gpa" name="past_gpa" min="0" max="10" step="0.1" required>
            </div>
            <button type="submit" class="btn">Predict Performance</button>
        </form>
    </div>
</body>
</html>
